services:
  gemini-agent:
    build: .
    container_name: gemini-agent
    ports:
      - 0.0.0.0:8000:8000
    volumes:
      - ./auth_state.json:/app/auth_state.json:ro
      - ./screenshots:/app/screenshots
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: gemini-redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  redis_data:
