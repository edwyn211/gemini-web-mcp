services:
  gemini-agent:
    build: .
    container_name: gemini-agent
    restart: unless-stopped
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - .:/app
      - ./auth_state.json:/app/auth_state.json
      - ./screenshots_host_access:/app/screenshots
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - AUTH_MAX_RETRIES=3
      - AUTH_RETRY_DELAY_SECONDS=60
      - AUTH_TIMEOUT_SELECTOR=30000
      - AUTH_TIMEOUT_NAVIGATION=60000
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: gemini-redis
    restart: unless-stopped
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data

volumes:
  redis_data:
