services:
  gemini-agent:
    build: .
    container_name: gemini-agent
    restart: unless-stopped
    # Medido 728 MiB en REPOSO, sin ningun Chromium vivo en ese instante
    # (comprobado con `ps` dentro del contenedor: solo corre fastmcp/python,
    # asi que es residuo, no pico). Este servicio si usa un navegador real:
    # el Dockerfile instala Playwright con `playwright install --with-deps
    # chromium` y session_manager.py lo lanza con --disable-dev-shm-usage
    # (/dev/shm mide 0% de uso en caliente, con el shm por defecto de 64M).
    # No hay tmpfs declarado para /tmp, asi que va a overlay, a disco.
    # El pico con el navegador abierto todavia NO esta medido: 1536m dobla
    # lo medido en reposo con margen, pero es provisional hasta medirlo.
    mem_limit: 1536m
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - .:/app
      - ./auth_state.json:/app/auth_state.json
      - ./screenshots_host_access:/app/screenshots
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - AUTH_MAX_RETRIES=3
      - AUTH_RETRY_DELAY_SECONDS=60
      - AUTH_TIMEOUT_SELECTOR=30000
      - AUTH_TIMEOUT_NAVIGATION=60000
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: gemini-redis
    restart: unless-stopped
    # Apenas usa 8 MiB; 256m es un techo holgado para un cache/broker de este
    # tamano, no una fraccion de lo medido.
    mem_limit: 256m
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data

volumes:
  redis_data:
