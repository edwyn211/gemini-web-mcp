services:
  gemini-agent:
    build: .
    container_name: gemini-agent
    ports:
      - 0.0.0.0:8000:8000
    volumes:
      - .:/app
      - ./auth_state.json:/app/auth_state.json
      - screenshots_data:/app/screenshots
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - AUTH_MAX_RETRIES=3
      - AUTH_RETRY_DELAY_SECONDS=60
      - AUTH_TIMEOUT_SELECTOR=30000
      - AUTH_TIMEOUT_NAVIGATION=60000
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: gemini-redis
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  redis_data:
  screenshots_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /home/user/Documentos/Github/gemini-web-mcp/screenshots_host_access
